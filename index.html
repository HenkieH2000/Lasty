:root{
  --bg:#F2F2F4;--card:#FFFFFF;--soft:#E9E9EC;--soft2:#F4F4F6;--ink:#111114;--ink2:#45454D;--muted:#8B8B94;
  --hero:#121214;--sel:#121214;--selink:#FFFFFF;
  --grad:linear-gradient(135deg,#FF7A3D 0%,#F7306E 50%,#B436E6 100%);
  --coral:#F4405C;--green:#18A84E;--red:#E5484D;
  --shadow:0 6px 20px rgba(20,20,40,.05);
}
.dark{
  --bg:#0B0B0D;--card:#17171A;--soft:#26262B;--soft2:#1F1F23;--ink:#F3F3F5;--ink2:#C9C9D1;--muted:#8D8D97;
  --hero:#17171A;--sel:#F3F3F5;--selink:#111114;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jakarta',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none}
.wrap{max-width:480px;margin:0 auto;padding:env(safe-area-inset-top) 18px 130px}
.i{width:22px;height:22px;flex:none}
.gi{stroke:url(#lg)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 16px;gap:12px}
.top .who{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:var(--shadow);flex:none}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.rbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(247,48,110,.32);flex:none}

  lockAvailable(){ try{ return NB ? NB.lockAvailable() : true }catch(e){ return false } },
  setLock(on){ if(NB) NB.setLock(on) },
  exportBackup(json, name){
    if(NB) return NB.exportBackup(json, name);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; a.click();
  },
  importBackup(){
    if(NB) return NB.importBackup();
    const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json';
    i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>window.onImport(String(r.result)); r.readAsText(f) }; i.click();
  },
  version(){ try{ return NB ? NB.version() : '1.4' }catch(e){ return '' } },
  sharePending(on){ if(NB) try{ NB.setSharePending(!!on) }catch(e){} },
  takeAction(){ try{ return NB && NB.takeAction ? NB.takeAction() : '' }catch(e){ return '' } }
};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){ const b=new Uint8Array(16); crypto.getRandomValues(b); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join(''); return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20); }
const FREQ = {
  month:   {l:'Maandelijks',  s:'Maand',   per:12, u:'p/m'},
  week:    {l:'Wekelijks',    s:'Week',    per:52, u:'p/w'},
  '4weeks':{l:'Elke 4 weken', s:'4 weken', per:13, u:'p/4w'},
  year:    {l:'Jaarlijks',    s:'Jaar',    per:1,  u:'p/j'}
};
const monthlyExact = (cents, f) => cents * (FREQ[f]||FREQ.month).per / 12;
function parts(c){ c=Math.round(c); const neg=c<0; c=Math.abs(c);
  return {neg, e:String(Math.floor(c/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'), c:String(c%100).padStart(2,'0')}; }
function fmt(c){ const p=parts(c); return (p.neg?'−':'')+'€'+p.e+','+p.c }
function money(c){ const p=parts(c); return `<span class="m">${p.neg?'−':''}<span class="eur">€</span>${p.e},${p.c}</span>` }
function parseAmount(str){
  let s=String(str||'').trim().replace(/[€\s]/g,''); if(!s) return null;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=Number(s); if(!isFinite(n)||n<0) return null; return Math.round(n*100);
}
const centsToInput = c => c==null ? '' : (Math.round(c)/100).toFixed(2).replace('.',',');
function ibanClean(s){ return String(s||'').replace(/\s+/g,'').toUpperCase() }
function ibanValid(s){
  s=ibanClean(s); if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  const r=s.slice(4)+s.slice(0,4); let m=0;
  for(const ch of r){ const v = ch>='A' ? String(ch.charCodeAt(0)-55) : ch; for(const d of v) m=(m*10+Number(d))%97; }
  return m===1;
}
const ibanFmt = s => ibanClean(s).replace(/(.{4})/g,'$1 ').trim();
function greeting(){ const h=new Date().getHours(); return h<6?'Goedenacht':h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond' }

}

  if(!logo && BANK_IMG[b]) logo=BANK_IMG[b];
  if(logo) return `<div class="bank img"><img src="${esc(logo)}" alt=""></div>`;
  const st=BANK_STYLE[b];
  if(st && BANK_SVG[b]) return `<div class="bank" style="background:${st[0]}"><svg viewBox="0 0 24 24" width="22" height="22" fill="${st[1]}"><path d="${BANK_SVG[b]}"/></svg></div>`;
  if(st) return `<div class="bank" style="background:${st[0]};color:${st[1]};font-size:${st[2].length>1?11:16}px">${st[2]}</div>`;
  return `<div class="bank other">${esc((name||'?').trim().charAt(0).toUpperCase())}</div>`;

function normalize(d){
  const p=presets();
  if(!d||typeof d!=='object'||!Array.isArray(d.accounts)||!Array.isArray(d.costs)) return null;
  d.settings=Object.assign({}, p.settings, d.settings||{});
  d.settings.reminder=Object.assign({}, p.settings.reminder, d.settings.reminder||{});
  d.settings.share=Object.assign({}, p.settings.share, d.settings.share||{});
  if(/^https:\/\/henkieh2000\.github\.io\/(lasty|Lastly)\/?$/i.test(d.settings.share.url)) d.settings.share.url=p.settings.share.url;
  d.incomes=Array.isArray(d.incomes)?d.incomes:[];
  d.tomb=d.tomb&&typeof d.tomb==='object'?d.tomb:{};
  d.sync=d.sync&&d.sync.id&&d.sync.key?d.sync:null;
  d.schema=1; return d;
}

/* ---------- sync (end-to-end encrypted via lasty-sync worker) ---------- */
function b64u(bytes){ let s=''; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'') }
function unb64u(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const b=atob(str), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u }
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const SYNC = {busy:false, again:false, err:'', timer:null};
const sharePending = () => false;
async function aesKey(){ return crypto.subtle.importKey('raw', unb64u(S.sync.key), 'AES-GCM', false, ['encrypt','decrypt']) }
async function encDoc(obj){
  const iv=rnd(12), ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await aesKey(), new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12); return b64u(out);
}
async function decDoc(str){
  const b=unb64u(str);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b.slice(0,12)}, await aesKey(), b.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function http(method, path, body){
  const url=SYNC_URL+path, payload=body?JSON.stringify(body):'';
  try{
    const r=await fetch(url, {method, cache:'no-store', headers: body?{'Content-Type':'application/json'}:{}, body: body?payload:undefined});
    return {status:r.status, json: await r.json().catch(()=>null)};
  }catch(e){
    if(NB && NB.http){ const res=JSON.parse(NB.http(method, url, payload)); let j=null; try{ j=JSON.parse(res.body) }catch(_){} return {status:res.status, json:j} }
    throw e;
  }
}
function localJoint(){
  const a=S.sync.role==='a';
  return {
    accounts: S.accounts.filter(x=>x.type==='joint').map(x=>({id:x.id, name:x.name, iban:x.iban||'', bank:x.bank, logo:x.logo||'', updatedAt:x.updatedAt||0})),
    costs: S.costs.filter(c=>c.split==='shared').map(c=>({id:c.id, name:c.name, category:c.category, amountCents:c.amountCents, freq:c.freq,
      pctA: a ? c.sharePct : 100-c.sharePct, accountId:c.accountId, active:c.active, note:c.note||'', updatedAt:c.updatedAt||0})),
    tomb: Object.assign({}, S.tomb)
  };
}
function mergeSets(x, y){
  const tomb=Object.assign({}, x.tomb); for(const k in y.tomb) tomb[k]=Math.max(tomb[k]||0, y.tomb[k]);
  const cut=Date.now()-180*864e5; for(const k in tomb) if(tomb[k]<cut) delete tomb[k];
  const pick=(la, lb)=>{ const m=new Map(); for(const r of la.concat(lb)){ const o=m.get(r.id); if(!o || (r.updatedAt||0)>(o.updatedAt||0)) m.set(r.id, r) }
    return [...m.values()].filter(r=>(r.updatedAt||0)>(tomb[r.id]||0)).sort((p,q)=>p.id<q.id?-1:p.id>q.id?1:0) };
  return {accounts:pick(x.accounts, y.accounts), costs:pick(x.costs, y.costs), tomb};
}
const canon = set => JSON.stringify([set.accounts.slice().sort((p,q)=>p.id<q.id?-1:1), set.costs.slice().sort((p,q)=>p.id<q.id?-1:1), Object.keys(set.tomb).sort().map(k=>[k,set.tomb[k]])]);
function applyJoint(m){
  const a=S.sync.role==='a';
  const accs=new Map(m.accounts.map(r=>[r.id,r])), costs=new Map(m.costs.map(r=>[r.id,r]));
  const toAcc = r => ({id:r.id, name:r.name, iban:r.iban, bank:r.bank, logo:r.logo||'', type:'joint', updatedAt:r.updatedAt});
  const toCost = r => ({id:r.id, name:r.name, category:r.category, amountCents:r.amountCents, freq:r.freq, split:'shared',
    sharePct: a ? r.pctA : 100-r.pctA, accountId:r.accountId, active:r.active, note:r.note||'', updatedAt:r.updatedAt});
  const outA=[], seenA=new Set();
  for(const x of S.accounts){
    const r=accs.get(x.id);
    if(x.type!=='joint' && !(r && (r.updatedAt||0)>(x.updatedAt||0))){ outA.push(x); seenA.add(x.id); continue }
    if(r){ outA.push(toAcc(r)); seenA.add(x.id) }
  }
  for(const r of m.accounts) if(!seenA.has(r.id)) outA.push(toAcc(r));
  const outC=[], seenC=new Set();
  for(const x of S.costs){
    const r=costs.get(x.id);
    if(x.split!=='shared' && !(r && (r.updatedAt||0)>(x.updatedAt||0))){ outC.push(x); seenC.add(x.id); continue }
    if(r){ outC.push(toCost(r)); seenC.add(x.id) }
  }
  for(const r of m.costs) if(!seenC.has(r.id)) outC.push(toCost(r));
  S.accounts=outA; S.costs=outC; S.tomb=m.tomb;
}
async function doSync(){
  if(!S.sync) return;
  if(SYNC.busy){ SYNC.again=true; return }
  SYNC.busy=true; refreshSyncUi();
  let changed=false;
  try{
    for(let attempt=0; attempt<4; attempt++){
      const g=await http('GET', '/v1/h/'+S.sync.id);
      let remote={accounts:[], costs:[], tomb:{}}, names=null, v=0;
      if(g.status===200 && g.json && g.json.data){
        v=g.json.v; const doc=await decDoc(g.json.data);
        remote={accounts:doc.accounts||[], costs:doc.costs||[], tomb:doc.tomb||{}}; names=doc.names||null;
      } else if(g.status!==404) throw new Error('http');
      const role=S.sync.role, before=canon(localJoint());
      if(role==='b' && names && names.b && !S.settings.meSet){ S.settings.me=names.b; changed=true }
      const merged=mergeSets(localJoint(), remote);
      if(canon(merged)!==before){ applyJoint(merged); changed=true }
      const nn={ a: role==='a' ? S.settings.me : ((names&&names.a)||S.settings.partner),
                 b: role==='b' ? S.settings.me : ((names&&names.b)||S.settings.partner) };
      const theirs = role==='a' ? nn.b : nn.a;
      if(theirs && theirs!==S.settings.partner){ S.settings.partner=theirs; changed=true }
      if(!names || names.a!==nn.a || names.b!==nn.b || canon(merged)!==canon(remote)){
        const p=await http('PUT', '/v1/h/'+S.sync.id, {v, data: await encDoc({schema:2, names:nn, accounts:merged.accounts, costs:merged.costs, tomb:merged.tomb})});
        if(p.status===409) continue;
        if(p.status!==200) throw new Error('http');
      }
      S.sync.last=Date.now(); SYNC.err='';
      break;
    }
  }catch(e){ SYNC.err = (e && e.name==='OperationError') ? 'key' : 'offline' }
  SYNC.busy=false;
  persist(true);
  if(changed){ if(!UI.ov.length && !$('#md').innerHTML && UI.ob<0 && !UI.locked) render(); else UI.dirty=true }
  refreshSyncUi();
  if(SYNC.again){ SYNC.again=false; setTimeout(doSync, 300) }
}
function syncText(){
  if(!S.sync) return '';
  if(SYNC.busy) return 'Synchroniseren…';
  if(SYNC.err==='key') return 'Koppeling klopt niet, koppel opnieuw';
  if(SYNC.err==='offline') return 'Offline · wordt later gesynchroniseerd';
  return S.sync.last ? 'Gesynchroniseerd met '+S.settings.partner+' · '+new Date(S.sync.last).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : 'Nog niet gesynchroniseerd';
}
function refreshSyncUi(){ document.querySelectorAll('[data-sync]').forEach(el=>el.textContent=syncText()) }
const PAIR_RE = /p=([A-Za-z0-9_-]{22,64})\.([A-Za-z0-9_-]{43})/;
function appUrl(){ return NB ? (S.settings.share.url||'').replace(/#.*$/,'') : location.href.split('#')[0].split('?')[0] }
function pairLink(){ return `${appUrl()}#p=${S.sync.id}.${S.sync.key}` }
async function joinWith(text){
  const m=String(text||'').match(PAIR_RE);
  if(!m){ toast('Dit is geen geldige koppellink'); return false }
  if(S.sync && S.sync.id===m[1]){ toast('Je bent al gekoppeld'); return true }
  S.sync={id:m[1], key:m[2], role:'b', last:0}; SYNC.err=''; persist(true);
  await doSync();
  if(SYNC.err==='key'){ S.sync=null; persist(true); toast('Deze koppellink werkt niet'); return false }
  toast(SYNC.err?'Gekoppeld, synchroniseren lukt zodra je online bent':'Gekoppeld met '+S.settings.partner);
  render(); return true;
}

const dateTxt = t => new Date(t).toLocaleString('nl-NL',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});

/* ---------- calculation ---------- */
function calc(){
  const acc = {};
  S.accounts.forEach(a => acc[a.id] = {a, exact:0, meExact:0, total:0, me:0, partner:0, items:[]});
  for(const c of S.costs){
    if(!c.active) continue;
    const t=acc[c.accountId]; if(!t) continue;
    const m=monthlyExact(c.amountCents, c.freq);
    const pct = c.split==='shared' ? (c.sharePct==null?50:c.sharePct) : 100;
    t.exact+=m; t.meExact+=m*pct/100;
    t.items.push({c, m, me:m*pct/100, partner:m*(100-pct)/100});
  }
  let me=0, partner=0, total=0;
  for(const id in acc){
    const t=acc[id];
    t.total=Math.round(t.exact+1e-7);
    if(S.sync && S.sync.role==='b'){ t.partner=Math.min(t.total, Math.round(t.exact-t.meExact+1e-7)); t.me=t.total-t.partner }
    else { t.me=Math.min(t.total, Math.round(t.meExact+1e-7)); t.partner=t.total-t.me }
    me+=t.me; partner+=t.partner; total+=t.total;
  }
  const income=Math.round(S.incomes.filter(i=>i.active).reduce((s,i)=>s+monthlyExact(i.amountCents,i.freq),0)+1e-7);
  return {acc, me, partner, total, income, free: income-me};
}

function donutSvg(segs, center, sub){
  const R=52, C=2*Math.PI*R, tot=segs.reduce((s,x)=>s+x.v,0)||1, gap=segs.filter(s=>s.v>0).length>1?4:0;
  let off=0, arcs='';
  for(const s of segs){
    if(s.v<=0) continue;
    const len=Math.max(0, s.v/tot*C-gap);
    arcs+=`<circle cx="68" cy="68" r="${R}" fill="none" stroke="${s.c}" stroke-width="16" stroke-linecap="butt"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 68 68)"/>`;
    off+=s.v/tot*C;
  }
  return `<svg viewBox="0 0 136 136"><circle cx="68" cy="68" r="${R}" fill="none" stroke="var(--soft)" stroke-width="16"/>${arcs}
    <text x="68" y="70" text-anchor="middle" class="ctr">${esc(center)}</text><text x="68" y="88" text-anchor="middle" class="ctr2">${esc(sub)}</text></svg>`;
}

    h+=`<h2>Wie betaalt wat<small>${fmt(c.total)} p/m</small></h2><div class="card donut">${donutSvg(segs, fmt(MODE==='owner'?c.me:c.partner).replace(/,\d+$/,''), MODE==='owner'?S.settings.me:S.settings.partner)}${legend(segs, c.total)}</div>`;
    // donut 3: own vs shared
    if(MODE==='owner'){ const own=S.accounts.filter(a=>a.type==='personal').reduce((s,a)=>s+c.acc[a.id].total,0);
    const segs2=[{n:'Alleen '+S.settings.me,v:own,c:'#FF7A3D'},{n:'Gedeeld',v:c.total-own,c:'#B436E6'}];
    h+=`<h2>Eigen of gedeeld</h2><div class="card donut">${donutSvg(segs2, (c.total?Math.round((c.total-own)/c.total*100):0)+'%', 'gedeeld')}${legend(segs2, c.total)}</div>`; }
  }
  // top 5
  const top=S.costs.filter(x=>x.active).map(x=>({x,m:Math.round(monthlyExact(x.amountCents,x.freq))})).filter(t=>t.m>0).sort((a,b)=>b.m-a.m).slice(0,5);
  if(top.length){
    h+=`<h2>Grootste posten</h2><div class="card">${top.map(t=>`<div class="hbar"><div class="top2"><span>${esc(t.x.name)}</span><span>${fmt(t.m)}</span></div><div class="tr"><i style="width:${Math.round(t.m/top[0].m*100)}%"></i></div></div>`).join('')}
      <div class="note">Per jaar: ${fmt(c.total*12)} aan vaste lasten, waarvan ${fmt((MODE==='owner'?c.me:c.partner)*12)} voor ${esc(MODE==='owner'?S.settings.me:S.settings.partner)}.</div></div>`;
  }
  return h;
}

  if(step===1) return `<div class="in">${steps}
    <h1 class="s">Koppelen</h1>
    <p>${S.sync?'Gekoppeld met '+esc(st.partner)+'. De gezamenlijke kosten staan erin.':'Heb je een koppellink gekregen? Kopieer hem in WhatsApp (ingedrukt houden → Kopieer) en plak hem hier.'}</p>
    ${S.sync?`<div class="row" style="background:#1A1A1E;box-shadow:none;color:#fff"><div class="ico" style="background:#26262B">${ic('check','gi')}</div><div class="tx"><div class="t">Gekoppeld met ${esc(st.partner)}</div><div class="s" data-sync>${esc(syncText())}</div></div></div>`:''}
    <div class="grow"></div>
    ${S.sync?`<button class="btn" onclick="A.ob(2)">Volgende</button>`
      :`<button class="btn" onclick="A.pairJoin()">${ic('paste')} Koppellink plakken</button><button class="skip" onclick="A.ob(2)">Later koppelen</button>`}</div>`;
  if(step===2) return `<div class="in">${steps}
    <h1 class="s">Hoe heten jullie?</h1><p>Deze namen zie je terug bij de bedragen.</p>
    <div class="field"><label>Jij</label><input id="ob_me" value="${esc(st.me)}" maxlength="24"></div>
    <div class="field"><label>Partner</label><input id="ob_pa" value="${esc(st.partner)}" maxlength="24"></div>
    <div class="grow"></div>
    <button class="btn" onclick="A.obNamesWeb()">Volgende</button></div>`;
  if(step===3||step===4) return `<div class="pin">${UI.pinChange?'':steps}<div class="applogo" style="margin-top:20px">L</div>
    <h1>${step===3?'Kies een pincode':'Herhaal je pincode'}</h1><p>${step===3?'4 cijfers om Lasty te openen':'Ter controle'}</p>${keypad(false)}
    ${UI.pinChange?`<button class="skip" onclick="A.cancelPin()">Annuleren</button>`:''}</div>`;
  return `<div class="pin">${steps}<div class="applogo" style="margin-top:20px">${ic('face')}</div>
    <h1>Face ID gebruiken?</h1><p>Dan opent Lasty met je gezicht. Je pincode blijft werken als reserve.</p>
    <div style="flex:1"></div>
    <button class="btn" onclick="A.obFace(true)">Face ID aanzetten</button>
    <button class="skip" onclick="A.obFace(false)">Niet nu</button></div>`;
}
function vInstall(){
  return `<div class="wrap"><div class="top"><div class="who"><div class="applogo" style="width:48px;height:48px;border-radius:15px;font-size:24px">L</div><div><h1>Lasty</h1><p>Vaste lasten, eerlijk verdeeld</p></div></div></div>
    ${UI.pendingPair?`<div class="card"><div class="t" style="font-weight:800;font-size:16px">Koppellink ontvangen</div>
      <div class="note" style="margin-top:4px">Kopieer hem nu. Je plakt hem straks in de app.</div>
      <button class="btn mt" onclick="A.copy(location.href.split('#')[0]+'#p='+UI.pendingPair,'Gekopieerd. Zet Lasty nu op je beginscherm')">${ic('copy')} Kopieer koppellink</button></div>`:''}
    <h2>Zet Lasty op je beginscherm</h2>
    <ol class="steplist"><li><span>Tik onderin Safari op ${ic('ishare')} Deel</span></li><li><span>Kies ${ic('addsq')} Zet op beginscherm</span></li><li><span>Open Lasty vanaf je beginscherm</span></li></ol>
    <div class="note">Daarna werkt Lasty als een gewone app, ook zonder internet, en wordt hij vanzelf bijgewerkt.</div></div>`;
}

const CAT={shown:0, timer:null};
function catSchedule(){
  clearTimeout(CAT.timer);
  if(S.settings.kitty===false || UI.view!=='home' || CAT.shown>=2) return;
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return }catch(e){}
  CAT.timer=setTimeout(catShow, 3500+Math.random()*6500);
}
function catShow(){
  if(UI.view!=='home' || UI.ov.length || UI.ob>=0 || UI.locked || $('#md').innerHTML) return;
  if(CAT.shown>0 && Math.random()<0.5) return;
  CAT.shown++;
  const img=new Image(); img.src=CAT_IMG; img.alt=''; img.draggable=false;
  const rows=[...document.querySelectorAll('.wrap .row')].slice(0,3), stack=$('.hero .stack');
  if(stack && (Math.random()<0.55 || !rows.length)){
    img.className='catpeek'; stack.insertBefore(img, stack.firstChild);
    const hide=()=>{ img.classList.remove('on'); setTimeout(()=>img.remove(), 900) };
    img.onclick=hide;
    requestAnimationFrame(()=>requestAnimationFrame(()=>img.classList.add('on')));
    setTimeout(hide, 3400);
  } else if(rows.length){
    img.className='catsit'; rows[0].appendChild(img);
    const hide=()=>{ img.classList.add('out'); setTimeout(()=>img.remove(), 480) };
    img.onclick=e=>{ e.stopPropagation(); hide() };
    setTimeout(hide, 4200);
  }
}

/* ---------- render ---------- */
function setBars(){
  const dark=document.documentElement.classList.contains('dark');
  const darkUi = UI.ob>=0 || UI.locked;
  const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content = darkUi?'#0A0A0B':(dark?'#0B0B0D':'#F2F2F4');
  if(darkUi) bridge.bars('#0A0A0B', false);
  else bridge.bars(dark?'#0B0B0D':'#F2F2F4', !dark);
}
function render(){
  if(WEB && IS_IOS && !STANDALONE){ $('#ov').innerHTML=''; $('#app').innerHTML=vInstall(); setBars(); return }
  if(UI.locked){ $('#app').innerHTML=''; $('#ov').innerHTML=`<div class="lock">${vLock()}</div>`; setBars(); return }
  if(UI.ob>=0){
    $('#app').innerHTML='';
    $('#ov').innerHTML=`<div class="ob">${NB?vOnboarding():vOnboardingWeb()}</div>`;
    setBars(); return;
  }
  const v={home:vHome, stats:vStats, costs:vCosts, accounts:vAccounts, settings:vSettings}[UI.view]();
  const items=[['home','home','Overzicht'],['stats','chart','Statistieken'],['costs','list','Kosten'],['accounts','card','Rekeningen'],['settings','gear','Instellingen']];
  const nav=items.map(([k,i,l])=>`<button class="${UI.view===k?'on':''}" onclick="A.go('${k}')" aria-label="${l}">${ic(i)}</button>`).join('');
  $('#app').innerHTML=`<div class="wrap">${v}</div><nav class="nav">${nav}</nav>`;
  renderOv(); setBars(); catSchedule();
}
function renderOv(){
  const top=UI.ov[UI.ov.length-1];
  if(!top){ $('#ov').innerHTML=''; return }
  const st=$('#ov .sheet'), y=st&&st.dataset.k===top.k?st.scrollTop:0;
  let h='';
  if(top.t==='cost') h=ovCost();
  else if(top.t==='income') h=ovIncome();
  else if(top.t==='account') h=ovAccount();
  else if(top.t==='accdetail') h=ovAccDetail(top.id);
  $('#ov').innerHTML=h;
  const ns=$('#ov .sheet'); if(ns){ ns.dataset.k=top.k; ns.style.animation=y?'none':''; ns.scrollTop=y; }
  if($('#prev')) A.prev();
  if(top.t==='account') A.ibanCheck(true);
}
function pushOv(o){ o.k=o.t+':'+(o.id||'')+':'+Date.now(); UI.ov.push(o); renderOv() }

async function hashPin(pin){
  const data=new TextEncoder().encode((SEC.salt||'')+':'+pin);
  if(window.crypto && crypto.subtle){ const h=await crypto.subtle.digest('SHA-256', data); return b64u(new Uint8Array(h)) }
  let x=5381; for(const b of data) x=((x*33)^b)>>>0; return 'f'+x.toString(36);
}
async function faceRegister(){
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32), rp:{name:'Lasty'},
      user:{id:rnd(16), name:'lasty-'+S.settings.partner.toLowerCase(), displayName:S.settings.partner},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'},
      timeout:60000, attestation:'none'}});
    SEC.faceId=b64u(new Uint8Array(cred.rawId)); saveSec(); return true;
  }catch(e){ toast('Face ID aanzetten lukte niet'); return false }
}

/* ---------- actions ---------- */
const A = {
  async pairCreate(){
    if(!crypto.subtle){ toast('Koppelen werkt hier niet'); return }
    S.sync={id:b64u(rnd(18)), key:b64u(rnd(32)), role:'a', last:0}; SYNC.err=''; persist(true);
    await doSync(); render();
    A.sendPair();
  },
  sendPair(){
    if(!S.sync) return;
    const p=S.settings.partner;
    bridge.share(`Hoi ${p}, koppel jouw Lasty met de mijne, dan blijven onze gezamenlijke vaste lasten vanzelf gelijk:\n\n${pairLink()}\n\nOpen de link in Safari en volg de stappen. Heb je Lasty al op je beginscherm? Kopieer dan de link en tik in Lasty op Koppellink plakken.`);
  },
  unpair(){ confirmBox('Ontkoppelen?', `Jullie gezamenlijke kosten blijven op deze telefoon staan, maar wijzigingen van ${S.settings.partner} komen niet meer binnen.`, 'Ontkoppelen', ()=>{ S.sync=null; persist(true); render(); toast('Ontkoppeld') }, true) },
  async pairJoin(){
    let t='';
    try{ if(navigator.clipboard && navigator.clipboard.readText) t=await navigator.clipboard.readText() }catch(e){ t='' }
    if(t && PAIR_RE.test(t)){ await joinWith(t); return }
    modalFn=null;
    $('#md').innerHTML=`<div class="scrim" onclick="if(event.target===this)A.closeModal()"><div class="modal"><h4>Koppellink plakken</h4>
      <p>Plak hieronder de link die ${esc(S.settings.partner)} je stuurde.</p>
      <textarea class="paste" id="pastebox" placeholder="Plak hier de link"></textarea>
      <button class="btn" onclick="A.pasteFromBox()">Koppelen</button><button class="btn two mt" onclick="A.closeModal()">Annuleren</button></div></div>`;
  },
  async pasteFromBox(){ const v=$('#pastebox').value; if(await joinWith(v)) A.closeModal() },
  toggleKitty(){ S.settings.kitty = S.settings.kitty===false; persist(true); CAT.shown=0; render() },
  setShareUrl(v){ v=v.trim(); if(!/^https:\/\/.+/.test(v)){ toast('Het adres moet met https:// beginnen'); render(); return } if(!v.endsWith('/') && !/\.html?$/.test(v)) v+='/'; S.settings.share.url=v; persist(); toast('Adres opgeslagen') },
  pickLogo(){
    const i=document.createElement('input'); i.type='file'; i.accept='image/*';
    i.onchange=()=>{
      const f=i.files[0]; if(!f) return;
      const img=new Image(), url=URL.createObjectURL(f);
      img.onload=()=>{
        const c=document.createElement('canvas'); c.width=c.height=96; const g=c.getContext('2d');
        const s=Math.min(img.width,img.height), sx=(img.width-s)/2, sy=(img.height-s)/2;
        g.drawImage(img, sx, sy, s, s, 0, 0, 96, 96); URL.revokeObjectURL(url);
        D.logo=c.toDataURL('image/png'); renderOv();
      };
      img.src=url;
    };
    i.click();
  },
  key(d){
    if(d==='del'){ UI.pin=UI.pin.slice(0,-1); A.dots(); return }
    if(UI.pin.length>=4) return;
    UI.pin+=d; A.dots();
    if(UI.pin.length===4) setTimeout(A.pinDone, 140);
  },
  dots(err){ const el=$('#dots'); if(!el) return; el.querySelectorAll('i').forEach((x,i)=>x.classList.toggle('on', i<UI.pin.length)); if(err){ el.classList.remove('err'); void el.offsetWidth; el.classList.add('err') } },
  async pinDone(){
    const pin=UI.pin;
    if(UI.locked){
      if(await hashPin(pin)===SEC.pinHash){ UI.locked=false; UI.pin=''; render() }
      else { UI.pin=''; A.dots(true) }
      return;
    }
    if(UI.ob===3){ UI.pinFirst=pin; UI.pin=''; UI.ob=4; render(); return }
    if(UI.ob===4){
      if(pin!==UI.pinFirst){ UI.pin=''; UI.pinFirst=''; UI.ob=3; render(); A.dots(true); toast('Pincodes komen niet overeen'); return }
      SEC.salt=uid(); SEC.pinHash=await hashPin(pin); saveSec(); UI.pin=''; UI.pinFirst='';
      if(UI.pinChange){ UI.pinChange=false; UI.ob=-1; render(); toast('Pincode gewijzigd'); return }
      if(UI.faceAvail){ UI.ob=5; render() } else A.obFace(false);
    }
  },
  async obFace(on){
    if(on && !(await faceRegister())) return;
    S.settings.onboarded=true; S.settings.meSet=true; UI.ob=-1; persist(); render();
  },
  obNamesWeb(){ const m=$('#ob_me').value.trim(), p=$('#ob_pa').value.trim(); if(m){ S.settings.me=m; S.settings.meSet=true } if(p) S.settings.partner=p; persist(); A.ob(3) },
  async toggleFace(){ if(SEC.faceId){ delete SEC.faceId; saveSec(); render(); return } if(await faceRegister()){ render(); toast('Face ID staat aan') } },
  async faceUnlock(){
    if(!SEC.faceId) return;
    try{
      await navigator.credentials.get({publicKey:{challenge:rnd(32), allowCredentials:[{type:'public-key', id:unb64u(SEC.faceId), transports:['internal']}], userVerification:'required', timeout:60000}});
      UI.locked=false; UI.pin=''; render();
    }catch(e){ toast('Face ID lukte niet, gebruik je pincode') }
  },
  changePin(){ UI.pinChange=true; UI.pin=''; UI.ob=3; render() },
  cancelPin(){ UI.pinChange=false; UI.pin=''; UI.ob=-1; render() },
  wipe(){ confirmBox('Alles wissen?', 'Je gegevens, pincode en Face ID worden van deze iPhone verwijderd.', 'Wissen', ()=>{ try{ localStorage.removeItem(SKEY); localStorage.removeItem('lasty-sec') }catch(e){} location.replace(location.pathname) }, true) },
  go(v){ UI.view=v; UI.ov=[]; render(); window.scrollTo(0,0) },
  who(w){ UI.who=w; render() },
  ctab(t){ UI.ctab=t; render() },
  sdim(d){ UI.sdim=d; UI.ssel=0; render() },
  ssel(i){ UI.ssel=i; const y=$('.bars').scrollLeft; render(); $('.bars').scrollLeft=y },
  filter(f){ UI.filter=f; $('#clist').innerHTML=costList(); document.querySelectorAll('.chips .chip').forEach((b,i)=>b.classList.toggle('on',['all','me','shared'][i]===f)) },
  search(q){ UI.q=q; $('#clist').innerHTML=costList() },
  closeOv(){ UI.ov.pop(); D=null; const t=UI.ov[UI.ov.length-1]; if(t&&t.draft) D=t.draft; UI.dirty=false; render() },
  closeModal(){ $('#md').innerHTML=''; modalFn=null; if(UI.dirty && !UI.ov.length){ UI.dirty=false; render() } },
  modalOk(){ const f=modalFn; A.closeModal(); if(f) f() },
  copy(t,msg){ bridge.copy(t); toast(msg) },
  accDetail(id){ pushOv({t:'accdetail', id}) },
  prev(){ const p=$('#prev'); if(p) p.innerHTML=prevHtml() },
  d(k,v){
    D[k]=v;
    if(k==='split'){
      const want=v==='shared'?'joint':'personal';
      const cur=S.accounts.find(a=>a.id===D.accountId);
      if(!cur||cur.type!==want){ const f=S.accounts.find(a=>a.type===want); D.accountId=f?f.id:'' }
    }
    renderOv();
  },
  editCost(id){
    const c=S.costs.find(x=>x.id===id);
    const firstPersonal=(S.accounts.find(a=>a.type==='personal')||{}).id||'';
    D = c ? Object.assign({kind:'cost'}, JSON.parse(JSON.stringify(c)), {amountTxt:centsToInput(c.amountCents)})
          : {kind:'cost', id:uid(), name:'', category:'', amountTxt:'', freq:'month', split:'me', sharePct:50, accountId:firstPersonal, active:true, note:''};
    pushOv({t:'cost', id:D.id, draft:D});
  },
  saveCost(){
    const cents=parseAmount(D.amountTxt);
    if(!D.name.trim()){ toast('Geef de kostenpost een naam'); $('#f_name').focus(); return }
    if(cents==null){ $('#e_amt').textContent='Vul een geldig bedrag in, bijvoorbeeld 40,46'; return }
    if(!D.accountId){ toast('Kies een rekening'); return }
    const old=S.costs.find(c=>c.id===D.id), now=Date.now();
    if(old && old.split==='shared' && D.split!=='shared') S.tomb[D.id]=now;
    const rec={id:D.id, name:D.name.trim(), category:(D.category||'Overig').trim(), amountCents:cents, freq:D.freq, split:D.split,
      sharePct:D.split==='shared'?D.sharePct:100, accountId:D.accountId, active:D.active, note:D.note||'', updatedAt:now};
    const i=S.costs.findIndex(c=>c.id===D.id);
    if(i>=0) S.costs[i]=rec; else S.costs.push(rec);
    persist(); UI.ov.pop(); D=null; render(); toast(i>=0?'Opgeslagen':'Kostenpost toegevoegd');
  },
  delCost(){
    const i=S.costs.findIndex(c=>c.id===D.id); if(i<0) return;
    const [rem]=S.costs.splice(i,1); if(rem.split==='shared') S.tomb[rem.id]=Date.now(); persist(); UI.ov.pop(); D=null; render();
    toast(`${rem.name} verwijderd`, 'Ongedaan maken', ()=>{ rem.updatedAt=Date.now()+1; S.costs.splice(i,0,rem); persist(); render() });
  },
  editIncome(id){
    const c=S.incomes.find(x=>x.id===id);
    D = c ? Object.assign({kind:'income'}, JSON.parse(JSON.stringify(c)), {amountTxt:centsToInput(c.amountCents)})
          : {kind:'income', id:uid(), name:'', amountTxt:'', freq:'month', active:true, note:''};
    pushOv({t:'income', id:D.id, draft:D});
  },
  saveIncome(){
    const cents=parseAmount(D.amountTxt);
    if(!D.name.trim()){ toast('Geef de inkomst een naam'); return }
    if(cents==null){ $('#e_amt').textContent='Vul een geldig bedrag in'; return }
    const rec={id:D.id, name:D.name.trim(), amountCents:cents, freq:D.freq, active:D.active, note:D.note||'', updatedAt:Date.now()};
    const i=S.incomes.findIndex(c=>c.id===D.id);
    if(i>=0) S.incomes[i]=rec; else S.incomes.push(rec);
    persist(); UI.ov.pop(); D=null; render(); toast(i>=0?'Opgeslagen':'Inkomst toegevoegd');
  },
  delIncome(){
    const i=S.incomes.findIndex(c=>c.id===D.id); if(i<0) return;
    const [rem]=S.incomes.splice(i,1); persist(); UI.ov.pop(); D=null; render();
    toast(`${rem.name} verwijderd`, 'Ongedaan maken', ()=>{ S.incomes.splice(i,0,rem); persist(); render() });
  },
  editAccount(id){
    const a=S.accounts.find(x=>x.id===id);
    D = a ? Object.assign({kind:'account', logo:''}, JSON.parse(JSON.stringify(a))) : {kind:'account', id:uid(), name:'', iban:'', bank:'other', type:'joint', logo:''};
    pushOv({t:'account', id:D.id, draft:D});
  },
  ibanCheck(silent){
    const e=$('#e_iban'); if(!e) return;
    const v=ibanClean(D.iban);
    e.textContent = !v || (silent && v.length<15) || ibanValid(v) ? '' : (v.length<15?'':'Dit IBAN klopt niet');
  },
  saveAccount(){
    if(!D.name.trim()){ toast('Geef de rekening een naam'); return }
    const v=ibanClean(D.iban);
    if(v && !ibanValid(v)){ $('#e_iban').textContent='Dit IBAN klopt niet'; return }
    const i=S.accounts.findIndex(a=>a.id===D.id);
    if(i>=0 && S.accounts[i].type!==D.type && S.costs.some(c=>c.accountId===D.id)){
      toast('Verplaats eerst de kostenposten van deze rekening'); return }
    if(i>=0 && S.accounts[i].type==='joint' && D.type!=='joint') S.tomb[D.id]=Date.now();
    const rec={id:D.id, name:D.name.trim(), iban:v, bank:D.bank, type:D.type, logo:D.logo||'', updatedAt:Date.now()};
    if(i>=0) S.accounts[i]=rec; else S.accounts.push(rec);
    persist(); UI.ov.pop(); D=null; const t=UI.ov[UI.ov.length-1]; if(t&&t.draft) D=t.draft; render(); toast('Rekening opgeslagen');
  },
  delAccount(){
    if(S.costs.some(c=>c.accountId===D.id)){ toast('Er staan nog kostenposten op deze rekening'); return }
    const i=S.accounts.findIndex(a=>a.id===D.id); if(i<0) return;
    const [rem]=S.accounts.splice(i,1); if(rem.type==='joint') S.tomb[rem.id]=Date.now(); persist(); UI.ov=[]; D=null; render();
    toast(`${rem.name} verwijderd`, 'Ongedaan maken', ()=>{ rem.updatedAt=Date.now()+1; S.accounts.splice(i,0,rem); persist(); render() });
  },
  share(){
    const c=calc(), p=S.settings.partner;
    const lines=S.accounts.map(a=>({a,t:c.acc[a.id]})).filter(x=>x.t.partner>0)
      .map(({a,t})=>`${a.name}: ${fmt(t.partner)}${a.iban?'\n'+ibanFmt(a.iban):''}`);
    if(!lines.length){ toast(`${p} hoeft niets over te maken`); return }
    const text=`Hoi ${p}, dit is jouw deel van de vaste lasten per maand:\n\n${lines.join('\n\n')}\n\nTotaal: ${fmt(c.partner)}`;
    bridge.share(text);
  },
  setName(k,v){ v=v.trim(); if(!v) { render(); return } S.settings[k]=v; if(k==='me') S.settings.meSet=true; persist(); toast('Naam opgeslagen') },
  toggleReminder(){
    const r=S.settings.reminder;
    if(r.enabled){ r.enabled=false; persist(); render(); return }
    window.onNotifPermission = ok => {
      if(!ok){ toast('Sta meldingen toe in de instellingen van je telefoon'); return }
      r.enabled=true; persist(); render(); toast(`Melding staat aan voor de ${r.day}e om ${String(r.hour).padStart(2,'0')}:00`);
    };
    bridge.askNotif();
  },
  rem(k,d){ const r=S.settings.reminder; if(k==='day') r.day=Math.min(28,Math.max(1,r.day+d)); else r.hour=(r.hour+d+24)%24; persist(); render() },
  testReminder(){ const c=calc(); bridge.testReminder('Tijd om de vaste lasten over te maken', `${S.settings.me} ${fmt(c.me)} · ${S.settings.partner} ${fmt(c.partner)}`); toast('Testmelding verstuurd') },
  toggleLock(){
    if(!S.settings.lock && !bridge.lockAvailable()){ toast('Stel eerst een schermvergrendeling in op je telefoon'); return }
    S.settings.lock=!S.settings.lock; bridge.setLock(S.settings.lock); persist(); render();
  },
  exportBackup(){ const d=new Date().toISOString().slice(0,10); bridge.exportBackup(JSON.stringify(S,null,1), `lasty-backup-${d}.json`) },
  importBackup(){ bridge.importBackup() },
  resetPresets(){
    confirmBox('Voorinstellingen terugzetten?', 'Al je kosten, inkomsten en rekeningen worden vervangen door de standaard lijst. Maak eventueel eerst een back-up.', 'Terugzetten', ()=>{
      const st=S.settings; S=presets(); S.settings=Object.assign(S.settings, {me:st.me, partner:st.partner, onboarded:true, reminder:st.reminder, lock:st.lock}); persist(); A.go('home'); toast('Voorinstellingen teruggezet');
    }, true);
  },
  ob(n){ UI.ob=n; render() },
  obNames(){ const m=$('#ob_me').value.trim(), p=$('#ob_pa').value.trim(); if(m) S.settings.me=m; if(p) S.settings.partner=p; persist(); A.ob(2) },
  obFinish(skip){
    if(!skip){
      let bad=false;
      document.querySelectorAll('[data-acc]').forEach(inp=>{
        const v=ibanClean(inp.value), err=inp.nextElementSibling;
        if(v && !ibanValid(v)){ err.textContent='Dit IBAN klopt niet'; bad=true } else err.textContent='';
      });
      if(bad) return;
      document.querySelectorAll('[data-acc]').forEach(inp=>{ const a=S.accounts.find(x=>x.id===inp.dataset.acc); if(a) a.iban=ibanClean(inp.value) });
    }
    S.settings.onboarded=true; UI.ob=-1; persist(); render();
    if(!S.settings.reminder.enabled) A.toggleReminder();
  }
};
window.A=A;

/* ---------- native callbacks ---------- */
window.goBack = function(){
  if($('#md').innerHTML){ A.closeModal(); return true }
  if(UI.locked) return false;
  if(UI.pinChange){ A.cancelPin(); return true }
  if(UI.ob>0){ UI.pin=''; A.ob(UI.ob-1); return true }
  if(UI.ob===0) return false;
  if(UI.ov.length){ A.closeOv(); return true }
  if(UI.view!=='home'){ A.go('home'); return true }
  return false;
};
window.onImport = function(text){
  let d=null; try{ d=normalize(JSON.parse(text)) }catch(e){}
  if(!d){ toast('Dit is geen geldige Lasty back-up'); return }
  confirmBox('Back-up terugzetten?', `${d.costs.length} kostenposten, ${d.incomes.length} inkomsten en ${d.accounts.length} rekeningen. Je huidige gegevens worden vervangen.`, 'Terugzetten', ()=>{
    d.settings.onboarded=true; S=d; persist(); A.go('home'); toast('Back-up teruggezet');
  });
};
window.onExported = ok => toast(ok?'Back-up opgeslagen':'Back-up niet opgeslagen');
window.onNotifPermission = ()=>{};
window.setDark = function(on){ document.documentElement.classList.toggle('dark', !!on); setBars() };

document.documentElement.classList.toggle('dark', !!bridge.isDark());
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e=>{ if(!NB) window.setDark(e.matches) }) }catch(e){}
(async function start(){
  const pm=location.hash.match(PAIR_RE);
  if(pm){ UI.pendingPair=pm[1]+'.'+pm[2]; try{ history.replaceState(null,'',location.pathname+location.search) }catch(e){} }
  if(WEB){
    try{ UI.faceAvail = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) }catch(e){}
    let hiddenAt=0;
    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden){ hiddenAt=Date.now(); return }
      if(SEC.pinHash && hiddenAt && Date.now()-hiddenAt>30000 && !UI.locked && UI.ob<0){ UI.locked=true; UI.pin=''; render() }
      doSync();
    });
    if('serviceWorker' in navigator && location.protocol==='https:'){
      navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
      let reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!reloaded && !UI.ov.length && UI.ob<0){ reloaded=true; location.reload() } });
    }
  } else {
    bridge.setLock(!!S.settings.lock); syncReminder(); bridge.sharePending(false);
  }
  render();
  if(UI.pendingPair && !(WEB && IS_IOS && !STANDALONE)){
    const code=UI.pendingPair; UI.pendingPair='';
    if(!S.sync){ await joinWith('#p='+code); if(UI.ob===0) A.ob(1) }
  }
  doSync();
  setInterval(()=>{ if(!document.hidden) doSync() }, 120000);
})();
window.onResumeApp = () => doSync();
window.onNativeAction = () => {};
</script>
</body>
</html>
